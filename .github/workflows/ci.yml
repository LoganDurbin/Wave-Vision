name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install project deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest PySide6 mediapipe opencv-python pyautogui

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          PYTHONPATH=. pytest -q
